[project]
name = "uscode-mcp"
version = "0.1.0"
description = "MCP server for searching and retrieving the US Code and Public Laws from GovInfo"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies get ceilings as well as floors (R9): raising a ceiling is a
# deliberate, tested change committed on its own — never drift.
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
uscode-mcp = "uscode_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uscode_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/fx.py" = ["E501"]
